# Example workflow for a repository that contains a .NET Framework solution.
# Copy to .github/workflows/ in that repository.
name: Migration scan

on:
  pull_request:
  schedule:
    - cron: '17 4 * * 1'   # weekly trend

permissions:
  contents: read
  security-events: write   # upload SARIF to code scanning

jobs:
  scan:
    runs-on: ubuntu-latest   # no Visual Studio / .NET Framework needed
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet tool install -g LegacyMigrationScanner
      - name: Scan
        # migration-baseline.json is a committed JSON report (see README, "Baseline"): PRs fail only on
        # findings they introduce. Drop --baseline/--fail-on-new to just report.
        run: >
          lms scan src/MyLegacyApp.sln -o lms-report -f json,md,sarif,html --sarif-root "$GITHUB_WORKSPACE"
          --baseline migration-baseline.json --fail-on-new --fail-on warning
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: lms-report/MyLegacyApp.migration-report.sarif
          category: legacy-migration
      - run: cat lms-report/*.md >> "$GITHUB_STEP_SUMMARY"
        if: always()
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: migration-report
          path: lms-report
