name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish again, e.g. v0.5.0 (GitHub release assets are replaced)
        required: true

permissions:
  contents: write
  id-token: write # NuGet.org Trusted Publishing: OIDC token exchanged for a 1-hour API key, no stored secret

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::'$TAG' is not a vX.Y.Z tag"; exit 1; fi

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Resolve version from tag
        id: version
        run: echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"

      - run: dotnet build -c Release /p:Version=${{ steps.version.outputs.value }}

      - run: dotnet test --no-build -c Release

      - run: dotnet pack --no-build -c Release -o artifacts /p:Version=${{ steps.version.outputs.value }}

      - name: Extract release notes from CHANGELOG
        # The tag must have a "## [x.y.z]" section in CHANGELOG.md; fail rather than publish a release without notes.
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          awk -v ver="$VERSION" 'index($0, "## [" ver "]") == 1 {found=1; next} found && /^## \[/ {exit} found {print}' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; fi

      # Trusted Publishing policy on nuget.org: owner alexander-bedenko, repo LegacyMigrationScanner, workflow release.yml.
      # Skipped when the NUGET_USER repository variable (nuget.org profile name) is not set, e.g. in forks.
      - name: NuGet login (OIDC → temporary API key)
        if: vars.NUGET_USER != ''
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet.org
        if: vars.NUGET_USER != ''
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" artifacts/*.nupkg --clobber
          else
            gh release create "$TAG" artifacts/*.nupkg --title "$TAG" --notes-file release-notes.md --generate-notes
          fi
